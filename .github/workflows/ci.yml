name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/gates.py
      - run: uv run --frozen python scripts/check_distribution.py
      - name: Test with the oldest supported helia-platforms
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          uv pip install --python .venv -e . "helia-platforms==0.2.0"
          uv run --no-sync python -m pytest -q
